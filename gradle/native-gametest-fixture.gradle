// Source-native fixture only; actual Forge RunConfig is authoritative, never JavaExec's premature root default.
def runConfig = minecraft.runs.getByName('gameTestServer')
def previousDirectory = project.file(runConfig.workingDirectory)
def attemptDirectory = previousDirectory.parentFile.name == 'attempts' ? previousDirectory :
    project.file('run-gametest/attempts/' + UUID.randomUUID())
project.ext.nativeGameTestDirectory = attemptDirectory
runConfig.workingDirectory(attemptDirectory)
// Existing old directories are never deleted, moved, mutated or silently adopted as fresh evidence.
afterEvaluate {
    tasks.matching { it.name in ['syncGameTestStructures', 'syncGameTestStructuresGameTest', 'prepareGametestStructures'] }.configureEach {
        if (it instanceof Copy) into(new File(attemptDirectory, 'gameteststructures'))
    }
}
def actualDirectory = {
    def directory = project.file(minecraft.runs.getByName('gameTestServer').workingDirectory).canonicalFile
    if (directory != attemptDirectory.canonicalFile || directory == project.projectDir.canonicalFile)
        throw new GradleException('Native RunConfig working-directory drift: ' + directory)
    directory
}
def prepareProperties = { File properties ->
    if (properties.exists() && !properties.isFile()) throw new GradleException('Native properties is not a regular file')
    if (!properties.exists()) {
        properties.parentFile.mkdirs()
        properties.text = '# Fresh nonshipping native fixture: all settings retain Minecraft defaults.\n'
    }
}
def verifyDiagnostics = { String text ->
    def failures = text.readLines().findAll { line ->
        ['/ERROR]', '/FATAL]', '[ERROR]', '[FATAL]', 'Mixin apply failed'].any { line.contains(it) }
    }
    if (failures) throw new GradleException('Unexpected native failed-operation diagnostics: ' + failures.take(8))
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def directory = actualDirectory()
        if (new File(directory, 'world').exists()) throw new GradleException('Refusing existing native world: ' + directory)
        prepareProperties(new File(directory, 'server.properties'))
        logger.lifecycle('Retained fresh actual Forge GameTest workingDirectory=' + directory)
    }
    doLast {
        def log = new File(actualDirectory(), 'logs/latest.log')
        if (!log.isFile()) throw new GradleException('Missing actual native log: ' + log)
        verifyDiagnostics(log.text)
        if (!log.text.contains('All 8 required tests passed') || !log.text.contains('8 GAME TESTS COMPLETE'))
            throw new GradleException('Expected exactly 8 authored required native tests: ' + log)
    }
}
tasks.register('verifyNativeGameTestFixtureGuard') {
    group = 'verification'
    doLast {
        actualDirectory()
        def properties = layout.buildDirectory.file('native-fixture-guard/' + UUID.randomUUID() + '/server.properties').get().asFile
        prepareProperties(properties)
        if (!properties.isFile() || !properties.readLines().every { !it || it.startsWith('#') })
            throw new GradleException('Absent native settings did not retain native defaults')
        def preserved = 'max-tick-time=123456\nlevel-name=retained-config\n'
        properties.text = preserved
        prepareProperties(properties)
        if (properties.text != preserved) throw new GradleException('Existing native settings changed')
        verifyDiagnostics('[00:00:00] [main/INFO] normal native setup')
        ['[00:00:00] [main/ERROR] synthetic guard input', '[00:00:00] [main/FATAL] synthetic guard input'].each { invalid ->
            boolean rejected = false
            try { verifyDiagnostics(invalid) } catch (GradleException expected) { rejected = true }
            if (!rejected) throw new GradleException('Pure diagnostic guard failed to reject ERROR/FATAL text')
        }
        logger.lifecycle('Native fixture pure guard: actual RunConfig + absent/default + preserve-existing + strict ERROR/FATAL negatives PASS')
    }
}
tasks.matching { it.name == 'verifyFast' }.configureEach { dependsOn('verifyNativeGameTestFixtureGuard') }
