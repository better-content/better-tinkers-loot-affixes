plugins {
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.24' apply false
}

ext {
    modId = 'better_tinkers_loot_affixes'
    artifactName = 'better-tinkers-loot-affixes'
    modName = 'Better Tinkers Loot Affixes'
    modGroupId = 'com.bettercontent'
    modDescription = 'Affixed Tinkers parts found throughout the world.'
}

apply from: file('gradle/forge-module.gradle')

dependencies {
    def mantleDep = 'curse.maven:mantle-74924:7563777'
    def tconstructDep = 'curse.maven:tinkers-construct-74072:7449219'
    compileOnly fg.deobf(mantleDep)
    compileOnly fg.deobf(tconstructDep)
    runtimeOnly fg.deobf(mantleDep)
    runtimeOnly fg.deobf(tconstructDep)
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the deterministic JVM verification lane.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs JVM verification and the headless Forge GameTests.'
    dependsOn tasks.named('verifyFast')
    dependsOn tasks.named('headlessGameTest')
}

tasks.named('headlessGameTest').configure {
    doLast {
        def gameTestSource = file('src/main/kotlin/com/bettercontent/bettertinkerslootaffixes/TConAffixGameTests.kt')
        def expectedTests = gameTestSource.readLines().count { it.contains('@GameTest(') }
        def gameTestLog = new File(project.ext.nativeGameTestDirectory, 'logs/latest.log')
        def successMarker = "All ${expectedTests} required tests passed"
        if (expectedTests == 0 || !gameTestLog.isFile() || !gameTestLog.text.contains(successMarker)) {
            throw new GradleException("Forge GameTest verification did not report '${successMarker}'")
        }
    }
}

// No destructive native reset: fresh retained attempts preserve all old worlds and diagnostics.
apply from: file('gradle/native-gametest-fixture.gradle')
